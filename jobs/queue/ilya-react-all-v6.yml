# Повтор A/B промпта v2 (нацелить агента на специализированные тулы) — v6.
# v5 УПАЛ не из-за промпта, а на старте sglang: на ноде sm100 FlashInfer autotune
# идёт ~14 мин + capture CUDA-графов, движок не уложился в дефолтный STARTUP_TIMEOUT
# 1800с (30 мин) → харнесс погасил его. Правка промпта (react-tools.yml v2 +
# TOOL_PROTOCOL с примером sympy_check) корректна и уже в ветке.
#
# Фикс: STARTUP_TIMEOUT=5400 (90 мин) — в белом списке диспетчера; даёт autotune
# и graph capture доехать. Остальное — как в v5 (react + tester + tools=all,
# все 3 бенча, sglang 48 seqs).
#
# Проверяем: начнёт ли модель звать sympy_check/solve_equation/closed_form (в
# прошлых прогонах — 0 вызовов), и как это влияет на точность.
command: "ENGINE=sglang STARTUP_TIMEOUT=5400 MAX_MODEL_LEN=131072 CONCURRENCY=32 scripts/run_benchmarks.sh -- .venv/bin/kedro run --pipeline benchmarks --params benchmarks.pipeline=react,benchmarks.react.tester=true,benchmarks.react.tools=all,benchmarks.prompt=conf/base/prompts/react-tools.yml,benchmarks.model.name={SERVED_MODEL_NAME},benchmarks.model.base_url={BASE_URL},benchmarks.select=[aime26;hmmt26;imo_answerbench],benchmarks.generation.max_tokens=90112,benchmarks.runtime.concurrency=32,benchmarks.serving.vllm_max_num_seqs=48,benchmarks.serving.vllm_max_model_len=131072,benchmarks.run_id={RUN_ID}"
gpus: 1
timeout_minutes: 240
