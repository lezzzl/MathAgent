# Прогон react-агента на imo_answerbench (400 задач) — v5, свежий полный прогон.
# Имя файла = run_id → results/runs/ilya-react-imo-v5/imo_answerbench.jsonl.
#
# v4-3 (sglang, 48 seqs) молотил быстро — 277 задач за ~30 мин — но оборвался на
# circuit breaker: react-вход раздувался (обрезанные по длине генерации по 90k
# возвращались в контекст) → вход+max_tokens > 131072 → 400 fatal.
#
# ФИКС в react.py (в этой же ветке):
#   • динамический max_tokens: на каждом шаге = min(90112, 131072 - оценка_входа -
#     запас) → вход+выход всегда ≤ контекста, 400 переполнения невозможен;
#   • гард лупа: генерацию с finish_reason=length без \boxed не зацикливаем
#     (не возвращаем 90k в контекст), а сразу дожимаем финал в \boxed.
#
# Движок — SGLang (как у тиммейта: поднялся с 48 seqs там, где vLLM ловил OOM,
# и заметно быстрее). ENGINE=sglang MAX_NUM_SEQS=48 CONCURRENCY=32.
# ~400 задач при 48-параллели ≈ 45 мин → timeout 120 с большим запасом.
command: ENGINE=sglang MAX_MODEL_LEN=131072 MAX_NUM_SEQS=48 CONCURRENCY=32 SELECT=[imo_answerbench] scripts/run_benchmarks.sh
gpus: 1
timeout_minutes: 120
