# Baseline CoT на Qwen/Qwen3.5-9B — HMMT26, seed 44.
#
# Один сид на задачу: так они встают в очередь независимо и идут параллельно,
# как только освобождаются карты.
#
# MTP=1: у Qwen3.5 в text_config стоит mtp_num_hidden_layers=1, спекуляция работает.
#
# Остальное зеркалит p-base-all-s45-v2 и прогоны на AIME26 (#26, #27), чтобы
# числа были сравнимы между моделями и бенчмарками.
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.5-9B
  SERVED_MODEL_NAME=Qwen/Qwen3.5-9B
  MTP=1
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks.sh --
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks hmmt26
  --pipeline solver
  --prompt conf/base/prompts/pavel/solver-v0.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --seed 44
  --max-tokens 65536
  --concurrency 80
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 1
timeout_minutes: 480
