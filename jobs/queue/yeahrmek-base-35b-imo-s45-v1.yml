# Baseline CoT на Qwen3.6-35B-A3B — IMO AnswerBench, seed 45.
#
# Один бенчмарк и один сид на задачу: так они встают в очередь независимо и идут
# параллельно, как только освобождаются карты. Зеркало p-base-all-s45-v2 (9B) —
# отличаются только модель, MTP и набор бенчмарков.
#
# MTP=0 обязателен: по умолчанию run_benchmarks.sh ставит 1, но MTP-слой есть у
# Qwen3.5, а не у Qwen3.6-35B-A3B. Со спекуляцией движок просто стартует без неё,
# написав предупреждение в runner.log, — прогон при этом идёт как ни в чём не бывало.
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.6-35B-A3B
  SERVED_MODEL_NAME=Qwen/Qwen3.6-35B-A3B
  MTP=0
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks.sh --
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks imo_answerbench
  --pipeline solver
  --prompt conf/base/prompts/pavel/solver-v0.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --seed 45
  --max-tokens 65536
  --concurrency 80
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 1
timeout_minutes: 1440
