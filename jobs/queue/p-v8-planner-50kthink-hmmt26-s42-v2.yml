# ReAct v8 с automatic repair, HMMT26, seed 42
# Planner: thinking=true, max_tokens=50000
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.5-9B
  SERVED_MODEL_NAME=Qwen/Qwen3.5-9B
  MTP=1
  STARTUP_TIMEOUT=7200
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks.sh --
  python scripts/benchmarks/pavel/run_hmmt26.py
  --pipeline react_agent
  --prompt conf/base/prompts/pavel/react-agent-v8-planner-50kthink.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --seed 42
  --max-tokens 65536
  --concurrency 80
  --max-tool-calls 20
  --max-format-retries 3
  --max-tool-repairs 5
  --execution-timeout 20
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 1
timeout_minutes: 1440
