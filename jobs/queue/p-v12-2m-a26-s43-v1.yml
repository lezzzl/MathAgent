# AIME26, seed 43: Qwen3.6-35B-A3B планирует, Qwen3.5-9B решает через ReAct v12
# Короткое имя спеки не переполняет лимит Unix socket path при запуске SGLang
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.5-9B
  SECOND_MODEL=Qwen/Qwen3.6-35B-A3B
  SERVED_MODEL_NAME=Qwen/Qwen3.5-9B
  SECOND_SERVED_MODEL_NAME=Qwen/Qwen3.6-35B-A3B
  MTP=1
  SECOND_MTP=0
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks_two_models.sh --
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks aime26
  --pipeline react_agent
  --prompt conf/base/prompts/pavel/react-agent-v12.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --planner-model {SECOND_MODEL}
  --planner-base-url {SECOND_BASE_URL}
  --planner-api-key EMPTY
  --seed 43
  --max-tokens 65536
  --concurrency 80
  --max-tool-calls 20
  --max-format-retries 3
  --max-tool-repairs 5
  --execution-timeout 20
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 2
timeout_minutes: 1440
