# Четыре запуска planner → agent без tools с seeds 42, 43, 44 и 45
# Qwen3.6-35B-A3B строит план без thinking, Qwen3.5-9B решает задачу
# Planner получает до 10000 токенов, agent — до 50000 токенов
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.5-9B
  SECOND_MODEL=Qwen/Qwen3.6-35B-A3B
  SERVED_MODEL_NAME=Qwen/Qwen3.5-9B
  SECOND_SERVED_MODEL_NAME=Qwen/Qwen3.6-35B-A3B
  MTP=1
  SECOND_MTP=0
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks_two_models.sh --
  scripts/run_seeds.sh
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks aime26 hmmt26 imo_answerbench
  --pipeline planner_agent
  --prompt conf/base/prompts/pavel/react-agent-v12-no-tools-planner-10k.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --planner-model {SECOND_MODEL}
  --planner-base-url {SECOND_BASE_URL}
  --planner-api-key EMPTY
  --max-tokens 50000
  --concurrency 80
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 2
timeout_minutes: 1440
