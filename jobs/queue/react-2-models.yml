# Три сида подряд на двух моделях: 9B — агент, 35B-A3B — планировщик.
#
# Спека исполняется без shell, поэтому цикл по сидам вынесен в scripts/run_seeds.sh
# и стоит ВНУТРИ команды бенчмарков: оба сервера поднимаются один раз на все три
# сида. Сиды и шаблон run-id зашиты в run_seeds.sh; --seed и --run-id дописывает
# он же, здесь их быть не должно.
#
# {BASE_URL} и {SECOND_BASE_URL} подставит run_benchmarks_two_models.sh — адреса
# серверов известны только после их старта.
command: >-
  MODEL=Qwen/Qwen3.5-9B
  SECOND_MODEL=Qwen/Qwen3.6-35B-A3B
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  SECOND_MTP=0
  scripts/run_benchmarks_two_models.sh --
  scripts/run_seeds.sh
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks aime26 hmmt26
  --pipeline react_agent
  --prompt conf/base/prompts/pavel/react-agent-v11.yml
  --model Qwen/Qwen3.5-9B
  --base-url {BASE_URL}
  --api-key EMPTY
  --planner-model Qwen/Qwen3.6-35B-A3B
  --planner-base-url {SECOND_BASE_URL}
  --planner-api-key EMPTY
  --max-tokens 65536
  --concurrency 30
  --max-tool-calls 20
  --max-tool-repairs 5
  --max-verification-rounds 2
  --execution-timeout 20
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-model-len 131072
gpus: 2
timeout_minutes: 1440
