# Три запуска проверенного ReAct v8 на одной 9B с seeds 43, 44, 45
# Каждый запуск проходит только IMOAnswerBench: v1 гонял ещё AIME26 и HMMT26,
# и на сутки таймаута их хватало впритык — здесь бюджет уходит целиком на IMO.
#
# SGLang поднимается один раз, а scripts/run_seeds.sh запускает три эксперимента
# и добавляет каждому собственные --seed и --run-id. Сиды и шаблон run_id заданы
# в самом скрипте: спека их задать не может.
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.5-9B
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks.sh --
  scripts/run_seeds.sh
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks imo_answerbench
  --pipeline react_agent
  --prompt conf/base/prompts/pavel/react-agent-v8.yml
  --model Qwen/Qwen3.5-9B
  --base-url {BASE_URL}
  --api-key EMPTY
  --max-tokens 65536
  --concurrency 30
  --max-tool-calls 20
  --max-tool-repairs 5
  --execution-timeout 20
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-model-len 131072
gpus: 1
timeout_minutes: 1440
