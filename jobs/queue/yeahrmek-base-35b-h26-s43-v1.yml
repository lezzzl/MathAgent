# Baseline CoT на Qwen/Qwen3.6-35B-A3B — HMMT26, seed 43.
#
# Один сид на задачу: так они встают в очередь независимо и идут параллельно,
# как только освобождаются карты.
#
# MTP=0: у Qwen3.6-35B-A3B MTP-слоя нет вовсе. С MTP=1 движок стартует без спекуляции, оставив лишь предупреждение в runner.log, — прогон при этом
#   идёт как ни в чём не бывало.
#
# Остальное зеркалит p-base-all-s45-v2 и прогоны на AIME26 (#26, #27), чтобы
# числа были сравнимы между моделями и бенчмарками.
command: >-
  ENGINE=sglang
  MODEL=Qwen/Qwen3.6-35B-A3B
  SERVED_MODEL_NAME=Qwen/Qwen3.6-35B-A3B
  MTP=0
  MAX_MODEL_LEN=131072
  MAX_NUM_SEQS=96
  scripts/run_benchmarks.sh --
  .venv/bin/python scripts/benchmarks/pavel/run_all_benchmarks.py
  --benchmarks hmmt26
  --pipeline solver
  --prompt conf/base/prompts/pavel/solver-v0.yml
  --model {MODEL}
  --base-url {BASE_URL}
  --api-key EMPTY
  --seed 43
  --max-tokens 65536
  --concurrency 80
  --timeout 7200
  --reasoning-parser qwen3
  --vllm-max-num-seqs 96
  --vllm-max-model-len 131072
gpus: 1
timeout_minutes: 480
