# Проверка фикса промпта react-tools-v2 на всех трёх бенчах (463 задачи).
# Имя файла = run_id → results/runs/ilya-react-all-v5/{aime26,hmmt26,imo_answerbench}.jsonl.
#
# ЗАЧЕМ: во всех прошлых react-прогонах модель звала ТОЛЬКО run_python —
# sympy_check/solve_equation/closed_form/test_claim не вызывались ни разу
# (в ilya-react-imo-v4: 302 из 302 вызовов — python). Причины были две:
#   • TOOL_PROTOCOL показывал единственный пример вызова как ```python —
#     якорил модель на нём (react.py: добавлен второй пример ```sympy_check);
#   • персона солвера перечисляла тулы, но не говорила предпочитать узкие
#     ручному коду, а run_python универсален (в нём есть sympy) — незачем
#     тянуться к остальным (react-tools.yml: явный порядок предпочтений).
#
# ЭКСПЕРИМЕНТ: конфиг ПОБИТОВО совпадает с ilya-react-pyfix-all-v1 (тот прошёл
# 463/463 за 92 мин, exit 0) — разница ровно одна: prompt_version react-tools-v1
# → v2. Значит любую разницу в распределении тулов и в accuracy можно отнести
# на счёт промпта. Сравнивать через scripts/analyze_runs.py с pyfix-all-v1
# (aime26/hmmt26/imo) и с notools-all-v1.
#
# timeout 240 мин: pyfix уложился в 92 мин; v2 зовёт тулы чаще (в этом и смысл),
# поэтому берём ~2.5x запаса, а не прежние 2400 — те стояли от старых оценок,
# когда прогон на MAX_NUM_SEQS=16 не осиливал даже imo за 35 часов.
command: "ENGINE=sglang MAX_MODEL_LEN=131072 CONCURRENCY=32 scripts/run_benchmarks.sh -- .venv/bin/kedro run --pipeline benchmarks --params benchmarks.pipeline=react,benchmarks.react.tester=true,benchmarks.react.tools=all,benchmarks.prompt=conf/base/prompts/react-tools.yml,benchmarks.model.name={SERVED_MODEL_NAME},benchmarks.model.base_url={BASE_URL},benchmarks.select=[aime26;hmmt26;imo_answerbench],benchmarks.generation.max_tokens=90112,benchmarks.runtime.concurrency=32,benchmarks.serving.vllm_max_num_seqs=48,benchmarks.serving.vllm_max_model_len=131072,benchmarks.run_id={RUN_ID}"
gpus: 1
timeout_minutes: 240
