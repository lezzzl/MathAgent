# Полный прогон react-агента на aime26 + hmmt26 + imo_answerbench (30+30+400=460).
# Имя файла = run_id → results/runs/ilya-react-full-v1/ (по файлу на бенч).
#
# Движок и пайплайн поднимает scripts/run_benchmarks.sh; после `--` команды нет
# → он сам зовёт kedro-пайплайн benchmarks с дефолтами
# (pipeline=react, react.tester=true, react.max_steps=8, prompt=react-tools.yml).
#
# Промпт СМЯГЧЁН относительно ilya-react-aime-hmmt-v1: тул проверяет только
# нетривиальную арифметику/гипотезы, без «run_python на каждой задаче» — это
# убирает трэшинг (id=27 жёг 8 шагов) и возвращает ~68 wall-с/задача (было ~106).
# Структурные фиксы остаются: узел finalize (принудительный \boxed) + max_steps=8.
#
# Оценка времени: 460 задач × ~68 wall-с ≈ 520 мин ≈ 8.7 ч. timeout 600 мин с запасом.
# Если всё же не успеет — диспетчер коммитит частичное, imo дорешаем resume-джобом.
#
# MAX_MODEL_LEN=131072 → max_tokens=90112 (скрипт считает сам). MAX_NUM_SEQS=16.
command: MAX_MODEL_LEN=131072 MAX_NUM_SEQS=16 SELECT=[aime26;hmmt26;imo_answerbench] scripts/run_benchmarks.sh
gpus: 1
timeout_minutes: 600
