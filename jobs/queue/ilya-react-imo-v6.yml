# Прогон react-агента на imo_answerbench (400 задач) — v6.
# v5 упал за 1 сек: после мержа main команда бенчмарков стала ОБЯЗАТЕЛЬНОЙ (пишется
# после `--`, адрес сервера — плейсхолдером {BASE_URL}), а v5 был в старом стиле
# без команды. Здесь команда задана явно — ровно как в рабочем прогоне тиммейта
# (ilya-react-imo-v4-3, который поднялся на sglang и отработал 277 задач).
# Имя файла = run_id → results/runs/ilya-react-imo-v6/imo_answerbench.jsonl.
#
# Фикс react.py (уже на origin, e6298f8) чинит обрыв v4-3 по circuit breaker:
#   • динамический max_tokens = min(90112, 131072 - оценка_входа - запас) → вход+
#     выход всегда ≤ контекста, 400 переполнения невозможен;
#   • гард лупа: генерацию finish_reason=length без \boxed не зацикливаем, а дожимаем.
#
# Движок sglang, 48 seqs (в --params vllm_max_num_seqs=48), concurrency 32.
# ~400 задач ≈ 45 мин → timeout 120 с запасом.
command: "ENGINE=sglang MAX_MODEL_LEN=131072 CONCURRENCY=32 scripts/run_benchmarks.sh -- .venv/bin/kedro run --pipeline benchmarks --params benchmarks.pipeline=react,benchmarks.react.tester=true,benchmarks.prompt=conf/base/prompts/react-tools.yml,benchmarks.model.name={SERVED_MODEL_NAME},benchmarks.model.base_url={BASE_URL},benchmarks.select=[imo_answerbench],benchmarks.generation.max_tokens=90112,benchmarks.runtime.concurrency=32,benchmarks.serving.vllm_max_num_seqs=48,benchmarks.serving.vllm_max_model_len=131072,benchmarks.run_id={RUN_ID}"
gpus: 1
timeout_minutes: 120
